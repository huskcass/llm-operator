# ceil(4 * 1.6/0.8) = 8, the per-replica ratio the Custom path skips.
"name": "an-empty-metricprovider-still-queries-prometheus"
"description": "an empty metricProvider still queries Prometheus"
"inputs":
  "sample": "1.6"
  "readyReplicas": 4
  "specReplicas": 4
  "minReplicas": 1
  "maxReplicas": 20
  "metrics":
  - "name": "kv-cache"
    "query": "avg(kv)"
    "target": "0.8"
"expected":
  "replicas": 8
  "path": "/api/v1/query"
