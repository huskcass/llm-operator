name: upgrades-and-bounds-history
description: upgrades and bounds history
historyLimit: 2
steps:
  - action: create
    version: "0.8.6"
  - action: reconcile
    expect: {}
  - action: capture
    capture:
      - revision
  - action: update
    layers:
      - name: site
        values: '{"replicaCount":2}'
  - action: reconcile
    expect: {}
  - action: update
    layers:
      - name: site
        values: '{"replicaCount":3}'
  - action: reconcile
    expect:
      upgrades: 2
      history:
        length: 2
        entries:
          - index: 0
            revision: 3
          - index: 1
            revision: 2
      helmRevision: 3
      capturedRevisionGone: true
      latestRevisionExists: true
