# Public release: a version tag builds the image and pushes it to Docker Hub
# and GHCR, and publishes the Helm chart to the GHCR OCI registry.
#
# The internal image is built separately by .gitlab-ci.yml and goes to harbor.
# Both build the same Dockerfile; only the base-image build args and the
# destination registry differ.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# GHCR publishing authenticates with the workflow's GITHUB_TOKEN, so no
# extra secrets are needed (the jobs below request packages: write).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  IMAGE: 4pdosc/llm-operator
  GHCR_IMAGE: ghcr.io/modelsphere/llm-operator
  CHART_OCI_REPO: oci://ghcr.io/modelsphere/charts

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The chart ships whatever appVersion says when image.tag is left empty,
      # so a tag that disagrees with it would publish one build and install
      # another. Fail here rather than after the push.
      - name: Tag must match the chart's appVersion
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          appversion=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' dist/chart/Chart.yaml)
          # A prerelease (0.3.2-rc1) is a candidate for the release it names, so
          # the gate compares the version core and ignores the suffix --
          # otherwise the only way to rehearse this workflow is to cut the real
          # release. Matches the same gate in .gitlab-ci.yml.
          if [ "${version%%-*}" != "$appversion" ]; then
            echo "tag ${GITHUB_REF_NAME} != chart appVersion ${appversion}"
            echo "bump dist/chart/Chart.yaml before tagging"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # latest is what someone gets when they ask for no version in
          # particular, so a candidate must never take it. Both registries
          # get the same tag set.
          {
            echo "tags<<TAGS_EOF"
            echo "${IMAGE}:${version}"
            echo "${GHCR_IMAGE}:${version}"
            case "$version" in
              *-*) echo "prerelease ${version}: not tagging latest" >&2 ;;
              *)
                echo "${IMAGE}:latest"
                echo "${GHCR_IMAGE}:latest"
                ;;
            esac
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
        id: version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  chart:
    # Runs after image: the tag-vs-appVersion gate in the image job fails the
    # whole workflow before a chart that disagrees with the tag can publish.
    name: Publish the chart to GHCR
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package and push the chart
        run: |
          set -eu
          chart_name=$(sed -n 's/^name: *//p' dist/chart/Chart.yaml)
          chart_version=$(sed -n 's/^version: *//p' dist/chart/Chart.yaml)
          helm package dist/chart
          helm push "${chart_name}-${chart_version}.tgz" "${CHART_OCI_REPO}"
